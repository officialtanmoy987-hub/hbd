<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Happy Birthday, Karru</title><script src="https://cdn.tailwindcss.com"></script><style>@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=DM+Sans:wght@400;500;600&family=Parisienne&display=swap');

:root { --ink:#3e3235; --muted:#78696e; --rose:#dfafb7; --rose-deep:#875b65; --lilac:#cbc7e4; --sage:#c9dacb; --ivory:#fcfaf6; --line:rgba(102,72,79,.14); }
* { box-sizing:border-box; }
html { scroll-behavior:smooth; }
body { margin:0; color:var(--ink); background:var(--ivory); font-family:'DM Sans',sans-serif; overflow-x:hidden; }
body::before { content:''; position:fixed; z-index:-2; inset:0; background:radial-gradient(circle at 0 8%,rgba(223,175,183,.28),transparent 29rem),radial-gradient(circle at 96% 25%,rgba(203,199,228,.38),transparent 30rem),radial-gradient(circle at 45% 100%,rgba(201,218,203,.32),transparent 28rem); }
a { color:inherit; text-decoration:none; } .serif { font-family:'Cormorant Garamond',serif; } .script { font-family:Parisienne,cursive; }
.shell { width:min(1120px,calc(100% - 2.5rem)); margin:auto; } .page { padding:8rem 0 3.5rem; min-height:100vh; }
.glass { background:rgba(255,255,255,.54); border:1px solid rgba(255,255,255,.75); box-shadow:0 18px 50px rgba(87,63,69,.09); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); }
.eyebrow { letter-spacing:.18em; text-transform:uppercase; font-size:.68rem; font-weight:600; color:var(--rose-deep); }
.display { font:600 clamp(3rem,8vw,6.5rem)/.88 'Cormorant Garamond',serif; letter-spacing:-.055em; }
.title { font:600 clamp(2.55rem,6vw,4.5rem)/.95 'Cormorant Garamond',serif; letter-spacing:-.045em; }
.lede { color:var(--muted); font-size:1.05rem; line-height:1.75; max-width:39rem; }
.btn { display:inline-flex; align-items:center; justify-content:center; gap:.55rem; border-radius:999px; padding:.9rem 1.25rem; font-size:.88rem; font-weight:600; transition:.3s ease; border:1px solid transparent; }
.btn-primary { background:var(--ink); color:white; box-shadow:0 10px 22px rgba(62,50,53,.17); }.btn-primary:hover{transform:translateY(-3px);box-shadow:0 15px 27px rgba(62,50,53,.23)}
.btn-soft { border-color:var(--line); background:rgba(255,255,255,.55); }.btn-soft:hover{border-color:var(--rose);background:white}.arrow{font-size:1.15rem;line-height:0}
.site-nav { position:fixed; z-index:20; inset:1rem 0 auto; transition:.3s ease; }.site-nav.is-scrolled{transform:translateY(-.35rem)}
.nav-inner { display:flex; align-items:center; justify-content:space-between; border-radius:999px; padding:.65rem .8rem .65rem 1rem; }.brand { font:600 1.55rem 'Cormorant Garamond',serif; }.nav-links{display:none;gap:1.1rem;font-size:.78rem;color:var(--muted)}.nav-links a:hover,.nav-links a.active{color:var(--ink)}
.menu-toggle{border:0;background:transparent;font-size:1.1rem;padding:.25rem}.mobile-menu{display:none;position:absolute;right:0;top:4rem;width:15rem;padding:.75rem;border-radius:1.25rem}.mobile-menu.open{display:grid}.mobile-menu a{padding:.7rem;border-radius:.75rem;font-size:.85rem}.mobile-menu a:hover{background:rgba(223,175,183,.2)}
.hero { display:grid; min-height:calc(100vh - 8rem); align-items:center; gap:3rem; }.hero-copy{position:relative;z-index:1}.hero-visual{position:relative;min-height:25rem}.orb{position:absolute;border-radius:50%;filter:blur(1px);animation:drift 9s ease-in-out infinite alternate}.orb.one{width:13rem;height:13rem;right:5%;top:1rem;background:var(--lilac)}.orb.two{width:9rem;height:9rem;left:5%;bottom:1rem;background:var(--sage);animation-delay:-4s}.polaroid{position:absolute;padding:.65rem .65rem 2.75rem;background:#fff;box-shadow:0 20px 45px rgba(67,45,50,.18);border-radius:.2rem}.polaroid img{width:100%;height:100%;object-fit:cover}.hero-photo{width:min(76vw,21rem);height:27rem;right:7%;top:1.5rem;transform:rotate(5deg)}.note{position:absolute;left:0;bottom:2.5rem;padding:1.1rem 1.25rem;border-radius:1rem;max-width:14rem;transform:rotate(-6deg)}
.photo-placeholder{display:grid;place-items:center;text-align:center;overflow:hidden;background:linear-gradient(135deg,#eadadd,#dedbf0 55%,#dceadd);color:#755f67;min-height:12rem}.photo-placeholder span{font:600 .7rem 'DM Sans';letter-spacing:.12em;text-transform:uppercase;padding:1rem}.photo-placeholder::after{content:'✦';display:block;font-size:2rem;opacity:.5}
.section{padding:4.5rem 0}.section-head{display:flex;justify-content:space-between;align-items:end;gap:1rem;margin-bottom:2.2rem}.reveal{opacity:0;transform:translateY(22px);transition:opacity .7s ease,transform .7s ease}.reveal.visible{opacity:1;transform:none}.page-enter{animation:pageIn .65s ease both}
.story-grid,.reason-grid{display:grid;gap:1rem}.card{border-radius:1.5rem;padding:1.5rem}.floating-card{transition:transform .35s ease,box-shadow .35s ease}.floating-card:hover{transform:translateY(-7px) rotate(-.5deg);box-shadow:0 25px 45px rgba(87,63,69,.14)}
.photo-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:.8rem}.photo-grid .photo-placeholder{border-radius:1.25rem;aspect-ratio:1/1.2}.photo-grid .photo-placeholder:first-child{grid-row:span 2;aspect-ratio:auto}.photo-grid img{width:100%;height:100%;object-fit:cover;border-radius:1.25rem;display:block}
.chapter-nav{display:flex;justify-content:space-between;align-items:center;margin-top:4rem;padding-top:1.5rem;border-top:1px solid var(--line);font-size:.85rem}.chapter-nav a{display:flex;align-items:center;gap:.45rem}.chapter-nav a:last-child{margin-left:auto}.chapter-nav a:hover{color:var(--rose-deep)}
.timeline{position:relative;margin-left:.55rem;border-left:1px solid rgba(135,91,101,.3);padding-left:2.2rem}.timeline-item{position:relative;padding:0 0 2.6rem}.timeline-item::before{content:'';position:absolute;left:-2.58rem;top:.3rem;width:.75rem;height:.75rem;border:3px solid var(--ivory);border-radius:50%;background:var(--rose-deep);box-shadow:0 0 0 1px var(--rose)}.timeline-date{color:var(--rose-deep);font-size:.75rem;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.letter{position:relative;padding:clamp(2rem,7vw,5rem);border-radius:.3rem;background:repeating-linear-gradient(to bottom,transparent 0,transparent 2.05rem,rgba(135,91,101,.11) 2.1rem);box-shadow:0 25px 55px rgba(68,48,52,.15)}.letter::before{content:'';position:absolute;inset:0;background:linear-gradient(115deg,rgba(255,255,255,.7),transparent 30%);pointer-events:none}.letter p{position:relative;font:1.45rem/2.1 'Cormorant Garamond',serif}.letter .signature{font:2.2rem Parisienne,cursive;color:var(--rose-deep)}
.countdown{display:grid;grid-template-columns:repeat(2,1fr);gap:.75rem;max-width:42rem}.time-unit{padding:1.35rem .7rem;text-align:center;border-radius:1.35rem}.time-unit strong{display:block;font:600 clamp(2.4rem,8vw,4.5rem)/1 'Cormorant Garamond',serif}.time-unit span{font-size:.66rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted)}
.reason{min-height:13rem;display:flex;flex-direction:column;justify-content:end;background:rgba(255,255,255,.45)}.reason .number{font:600 3rem/1 'Cormorant Garamond',serif;color:rgba(135,91,101,.24);margin-bottom:auto}.reason h3{font:600 1.6rem 'Cormorant Garamond',serif;margin:0}.reason p{color:var(--muted);font-size:.9rem;line-height:1.6;margin:.45rem 0 0}
.music{display:flex;align-items:center;gap:1rem;padding:1rem}.music-art{width:4rem;height:4rem;border-radius:.9rem;background:linear-gradient(145deg,var(--rose),var(--lilac))}.sound-bars{display:flex;gap:3px;align-items:center;height:1rem}.sound-bars i{height:30%;width:3px;background:var(--rose-deep);animation:beat .9s ease-in-out infinite alternate}.sound-bars i:nth-child(2){height:90%;animation-delay:-.5s}.sound-bars i:nth-child(3){height:55%;animation-delay:-.2s}
.heart{position:fixed;bottom:-2rem;pointer-events:none;z-index:3;color:var(--rose-deep);animation:floatUp linear forwards}.confetti{position:fixed;top:-1rem;z-index:30;width:.55rem;height:.85rem;pointer-events:none;animation:confettiFall linear forwards}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}@keyframes drift{to{transform:translate(1.2rem,-1rem) scale(1.08)}}@keyframes beat{to{transform:scaleY(.45)}}@keyframes floatUp{to{transform:translate(var(--x),-110vh) rotate(280deg);opacity:0}}@keyframes confettiFall{to{transform:translate(var(--x),105vh) rotate(720deg)}}
@media(min-width:720px){.nav-links{display:flex}.menu-toggle{display:none}.hero{grid-template-columns:1fr 1fr}.story-grid{grid-template-columns:repeat(3,1fr)}.reason-grid{grid-template-columns:repeat(3,1fr)}.photo-grid{grid-template-columns:repeat(4,1fr)}.photo-grid .photo-placeholder:first-child{grid-column:span 2}.countdown{grid-template-columns:repeat(4,1fr)}.page{padding-top:9rem}.timeline{margin-left:20%}.timeline-item{max-width:34rem}.hero-photo{right:12%;width:22rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
</style></head><body class="final-page"><div data-site-nav></div><main class="page shell"><section class="min-h-[75vh] flex items-center justify-center text-center"><div class="reveal"><p class="eyebrow">The end, and the next plan</p><h1 class="display mt-5">Happy birthday,<br><em>Karru.</em></h1><p class="lede mx-auto mt-6">No matter how many meetup plans fail, one day we’ll finally click that first selfie. Until then, keep being the funny, rare, unforgettable human you are.</p><p class="script text-4xl mt-10 text-[var(--rose-deep)]">From Ishuu — always in your corner.</p><p class="mt-5 text-lg">Happy Birthday, Karru <span aria-label="heart">❤</span></p><a class="btn btn-primary mt-8" href="index.html">Relive the chaos <span class="arrow">↺</span></a></div></section></main><script>(() => {
  const pages = [['How we met','how-we-met.html'],['Fun era','story.html'],['Impossible mission','memories.html'],['Plot twist','timeline.html'],['Resume','countdown.html'],['Gallery','gallery.html'],['Karru things','reasons.html'],['Letter','letter.html'],['Finale','final.html']];
  const current = location.pathname.split('/').pop() || 'index.html';
  document.querySelectorAll('[data-site-nav]').forEach(host => {
    host.innerHTML = `<nav class="site-nav"><div class="shell nav-inner glass"><a class="brand" href="index.html">for you, always.</a><div class="nav-links">${pages.map(([label, href]) => `<a class="${current === href ? 'active' : ''}" href="${href}">${label}</a>`).join('')}</div><button class="menu-toggle" aria-label="Open menu" aria-expanded="false">☰</button><div class="mobile-menu glass">${pages.map(([label,href])=>`<a href="${href}">${label}</a>`).join('')}</div></div></nav>`;
  });
  document.body.classList.add('page-enter');
  const observer = new IntersectionObserver(entries => entries.forEach(entry => { if(entry.isIntersecting) { entry.target.classList.add('visible'); observer.unobserve(entry.target); } }), {threshold:.12});
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
  document.addEventListener('click', e => { const toggle=e.target.closest('.menu-toggle'); if(toggle){const menu=toggle.parentElement.querySelector('.mobile-menu'); const open=menu.classList.toggle('open');toggle.setAttribute('aria-expanded',open);toggle.textContent=open?'×':'☰';} });
  window.addEventListener('scroll',()=>document.querySelector('.site-nav')?.classList.toggle('is-scrolled',scrollY>12),{passive:true});
  document.querySelectorAll('[data-parallax]').forEach(el => window.addEventListener('scroll',()=>{el.style.transform=`translateY(${scrollY * Number(el.dataset.parallax || .03)}px)`},{passive:true}));
})();
</script><script>(() => { if(!document.body.classList.contains('final-page')) return; const colors=['#dfafb7','#cbc7e4','#c9dacb','#f2dba2']; for(let i=0;i<20;i++){const el=document.createElement('i');el.className='heart';el.textContent='✦';el.style.left=Math.random()*100+'vw';el.style.setProperty('--x',(Math.random()*140-70)+'px');el.style.animationDuration=(6+Math.random()*6)+'s';el.style.animationDelay=(Math.random()*5)+'s';document.body.append(el);} for(let i=0;i<45;i++){const el=document.createElement('i');el.className='confetti';el.style.left=Math.random()*100+'vw';el.style.background=colors[i%colors.length];el.style.setProperty('--x',(Math.random()*180-90)+'px');el.style.animationDuration=(3+Math.random()*3)+'s';el.style.animationDelay=(Math.random()*2)+'s';document.body.append(el);} })();
</script></body></html>
